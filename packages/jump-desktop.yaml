name: jump-desktop
display_name: Jump Desktop
description: High-performance remote desktop client application supporting RDP, VNC, and Fluid protocols
homepage: https://jumpdesktop.com/#jdmac

default: brew

backends:
  brew:
    summary: Dedicated Linux Electron Web Wrapper with Advanced Hotkey Passthrough (recommended for Linux)
    pros:
      - Full keyboard passthrough (traps Ctrl+W, Ctrl+T, Alt+Tab, Super, and Esc from host interference)
      - Three-finger trackpad swipes forward Cmd+Option+Ctrl+Shift plus the matching arrow to the remote Mac
      - Toggleable Mac-Mode modifier remapping (Ctrl+Shift+M)
      - Auto-hiding top control pill & persistent session profile in ~/.config/jump-desktop/
      - Standalone desktop entry, WMClass, and system launcher integration
    cons:
      - Uses Jump Desktop Web client interface over WebRTC
    formula: Brandon-Gottshall/fedora-brew/jump-desktop

  cask:
    summary: Official macOS Cask (macOS only)
    pros:
      - Native macOS Cocoa/Metal application with Fluid protocol support
      - Multi-protocol support (RDP, VNC, Fluid)
      - Cloud synchronization and automatic connection setup
    cons:
      - macOS client only; Jump Desktop does not publish a native Linux client binary
    cask: Brandon-Gottshall/fedora-brew/jump-desktop

  flatpak:
    summary: Alternative Linux Client (Remmina on Flathub)
    pros:
      - Modern sandboxed client supporting standard RDP, VNC, SSH, and SPICE
      - Full clipboard, sound, and multi-monitor redirection
    cons:
      - Standard RDP/VNC only (does not support Jump Desktop proprietary Fluid protocol)
    remote: flathub
    app_id: org.remmina.Remmina

  rpm:
    summary: Alternative Native Fedora Client (Remmina via DNF)
    pros:
      - Native desktop environment integration
      - Direct updates managed through DNF
    cons:
      - Standard RDP/VNC protocols only
    package: remmina
